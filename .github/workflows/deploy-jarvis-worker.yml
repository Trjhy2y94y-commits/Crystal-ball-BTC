name: Deploy JARVIS Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN GitHub Actions secret."
            exit 1
          fi
          if [[ -z "${OPENAI_API_KEY}" ]]; then
            echo "::error::Add the OPENAI_API_KEY GitHub Actions secret."
            exit 1
          fi

      - name: Install pinned Wrangler
        run: npm install --global wrangler@4.36.0

      - name: Store OpenAI key as a Worker secret
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${OPENAI_API_KEY}" | wrangler secret put OPENAI_API_KEY

      - name: Deploy Worker
        working-directory: worker
        run: wrangler deploy
