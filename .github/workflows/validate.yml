name: Validate Cristal BTC

on:
  push:
    branches: [main, chatgpt-improvements]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate secure JARVIS Worker syntax
        run: node --check worker/worker.js
      - name: Run JARVIS Worker security and API tests
        run: node --experimental-default-type=module --test worker/worker.test.mjs
      - name: Run market-data integrity tests
        run: node --test tests/market-data.test.mjs
      - name: Validate PWA and local assets
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, unquote
          import json
          import subprocess
          import tempfile
          import tomllib

          root = Path(".")
          worker_config = tomllib.loads((root / "worker/wrangler.toml").read_text(encoding="utf-8"))
          rate_limits = {item["name"]: item for item in worker_config.get("ratelimits", [])}
          expected_limits = {"JARVIS_CHAT_LIMITER": (30, 60), "JARVIS_VOICE_LIMITER": (8, 60)}
          if set(rate_limits) != set(expected_limits):
              raise SystemExit("JARVIS Cloudflare rate-limit bindings are missing or duplicated")
          namespace_ids = [item["namespace_id"] for item in rate_limits.values()]
          if len(namespace_ids) != len(set(namespace_ids)) or any(not str(value).isdigit() or int(value) <= 0 for value in namespace_ids):
              raise SystemExit("Cloudflare rate-limit namespace IDs must be unique positive integers")
          for name, (limit, period) in expected_limits.items():
              actual = rate_limits[name]["simple"]
              if (actual.get("limit"), actual.get("period")) != (limit, period):
                  raise SystemExit(f"Unexpected Cloudflare rate-limit policy for {name}")
          manifest = json.loads((root / "manifest.webmanifest").read_text(encoding="utf-8"))
          if manifest.get("start_url") != "./" or manifest.get("scope") != "./":
              raise SystemExit("Manifest start_url/scope must match the GitHub Pages subpath")
          if manifest.get("display") != "standalone":
              raise SystemExit("Manifest display must remain standalone")
          for icon in manifest.get("icons", []):
              asset = root / unquote(urlsplit(icon["src"]).path).removeprefix("./")
              if not asset.is_file():
                  raise SystemExit(f"Manifest icon missing: {asset}")

          sw = (root / "service-worker.js").read_text(encoding="utf-8")
          subprocess.run(["node", "--check", "service-worker.js"], check=True)
          start = sw.find("const SHELL = [")
          end = sw.find("];", start)
          if start < 0 or end < 0:
              raise SystemExit("Service worker shell list not found")
          shell_lines = sw[start:end].splitlines()[1:]
          for line in shell_lines:
              asset = line.strip().rstrip(",").strip().strip("'").strip('"')
              if not asset:
                  continue
              local = root / unquote(urlsplit(asset).path).removeprefix("./")
              if asset == "./":
                  local = root / "index.html"
              if not local.is_file():
                  raise SystemExit(f"Service worker precache asset missing: {local}")

          class AuditHTML(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.resources = []
                  self.active = False
                  self.current = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get("id"):
                      self.ids.append(attrs["id"])
                  for key in ("src", "href"):
                      value = attrs.get(key)
                      if value:
                          self.resources.append((tag, key, value))
                  if tag.lower() == "script":
                      self.active = not attrs.get("src") and attrs.get("type", "text/javascript") in ("text/javascript", "application/javascript", "module", "")
                      self.current = []

              def handle_data(self, data):
                  if self.active:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script":
                      if self.active:
                          self.scripts.append("".join(self.current))
                      self.active = False
                      self.current = []

          parser = AuditHTML()
          parser.feed((root / "index.html").read_text(encoding="utf-8"))
          duplicates = sorted({item for item in parser.ids if parser.ids.count(item) > 1})
          if duplicates:
              raise SystemExit(f"Duplicate HTML id(s): {', '.join(duplicates)}")

          for tag, key, value in parser.resources:
              parts = urlsplit(value)
              if parts.scheme or value.startswith(("#", "//")):
                  continue
              local = root / unquote(parts.path).removeprefix("./")
              if not parts.path or not local.is_file():
                  raise SystemExit(f"Broken local {key} on <{tag}>: {value}")

          if not parser.scripts:
              raise SystemExit("No inline JavaScript blocks found")
          with tempfile.TemporaryDirectory() as tmp:
              for i, source in enumerate(parser.scripts):
                  path = Path(tmp) / f"inline-{i}.js"
                  path.write_text(source, encoding="utf-8")
                  subprocess.run(["node", "--check", str(path)], check=True)
          print(f"Validated PWA manifest, {len(parser.scripts)} inline JS block(s), service worker, local assets and unique HTML ids")
          PY

  mobile-smoke:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install chromium
      - name: Start local app
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/cristal-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cristal-http.log
          exit 1
      - name: iPhone-sized browser smoke test
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json

          errors = []
          console_errors = []
          with sync_playwright() as p:
              browser = p.chromium.launch()
              context = browser.new_context(**p.devices["iPhone 13"])
              page = context.new_page()
              page.on("pageerror", lambda error: errors.append(str(error)))
              page.on("console", lambda msg: console_errors.append(msg.text) if msg.type == "error" else None)
              page.goto("http://127.0.0.1:4173/", wait_until="domcontentloaded", timeout=30000)
              try:
                  page.wait_for_function(
                      "() => !!document.querySelector('#home')?.innerText.trim()",
                      timeout=30000
                  )
              except Exception as exc:
                  page.screenshot(path="artifacts/iphone-home-failure.png", full_page=True)
                  raise AssertionError(
                      "Home view did not render within 30s. "
                      f"pageErrors={errors}; consoleErrors={console_errors}; "
                      f"readyState={page.evaluate('document.readyState')}; "
                      f"url={page.url}; waitError={exc}"
                  )

              assert page.title() == "Cristal · BTC", "Unexpected page title"
              assert page.locator(".tabbar").is_visible(), "Bottom navigation is missing"
              assert page.locator("#home").is_visible(), "Home view is not visible"
              assert page.locator("#home").inner_text().strip(), "Home view did not render"
              assert page.locator("#homeQuant").is_visible(), "Redesigned Crystal Quant cockpit is missing from the first screen"
              assert page.locator("#homeQtPrice").is_visible(), "Cockpit BTC price is missing"
              assert page.locator("#homeQtBias").is_visible(), "Cockpit market regime is missing"
              assert not page.locator("#home .ck-hero").is_visible(), "Legacy duplicate price hero is still visible under the new cockpit"
              cockpit = page.locator("#homeQuant").bounding_box()
              assert cockpit and cockpit["width"] >= 340 and cockpit["height"] >= 180, f"Cockpit layout is unexpectedly collapsed: {cockpit}"
              page.screenshot(path="artifacts/iphone-cockpit.png")

              page.locator('.tabbar button[data-tab="chart"]').click()
              assert page.locator("#vChart").is_visible(), "Chart tab did not open"
              assert page.locator("#cv").is_visible(), "Chart canvas is not visible"
              assert page.locator("#quantTerminal").is_visible(), "Crystal Quant Terminal is missing from the chart view"
              assert page.locator("#qtPrice").is_visible(), "Quant terminal price field is missing"

              page.locator('.tabbar button[data-tab="cal"]').click()
              assert page.locator("#vCal").is_visible(), "Calendar tab did not open"

              page.locator('.tabbar button[data-tab="jarvis"]').click()
              assert page.locator("#vJarvis").is_visible(), "JARVIS tab did not open"
              assert page.locator("#jvEndpoint").is_visible(), "JARVIS secure backend field is missing"
              assert page.locator("#jvConnect").is_visible(), "JARVIS connection test control is missing"
              page.locator("#jvInput").fill("ouvre analyse")
              page.locator("#jvForm button[type=submit]").click()
              assert page.locator("#vChart").is_visible(), "JARVIS local navigation command failed"

              page.locator('.tabbar button[data-tab="stats"]').click()
              assert page.locator("#vStats").is_visible(), "Stats tab did not open"
              page.wait_for_timeout(500)

              dimensions = page.evaluate("""() => ({
                viewport: window.innerWidth,
                document: document.documentElement.scrollWidth,
                app: document.querySelector('.app').scrollWidth,
                bottomNavHeight: document.querySelector('.tabbar').getBoundingClientRect().height
              })""")
              assert dimensions["document"] <= dimensions["viewport"] + 1, f"Horizontal page overflow: {dimensions}"
              assert dimensions["app"] <= dimensions["viewport"] + 1, f"App horizontal overflow: {dimensions}"
              assert dimensions["bottomNavHeight"] >= 44, f"Bottom navigation touch area too small: {dimensions}"
              page.screenshot(path="artifacts/iphone-emulation.png")
              if errors:
                  raise AssertionError("Uncaught JavaScript errors: " + " | ".join(errors))
              print(json.dumps({"result":"passed","dimensions":dimensions,"uncaughtErrors":errors}))
              browser.close()
          PY
      - name: Upload iPhone emulation screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cristal-btc-iphone-emulation
          path: artifacts/*.png
          if-no-files-found: ignore
