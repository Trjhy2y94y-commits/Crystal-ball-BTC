name: CrystalBall
options:
  bundleIdPrefix: com.crystalballbtc
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Crystal Ball"
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "JARVIS utilise le microphone pour dialoguer avec toi en temps réel."
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "La reconnaissance vocale détecte « Salut Jarvis » lorsque l’application est ouverte."
targets:
  CrystalBall:
    type: application
    platform: iOS
    sources:
      - path: CrystalBall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crystalballbtc.ios
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
